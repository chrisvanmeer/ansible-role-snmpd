---
# tasks file for ansible-role-snmpd

- name: Combine the global, group and host level SNMPv3 users
  ansible.builtin.set_fact:
    snmpd_v3_users: >-
      {{
        snmpd_v3_users_global
        + snmpd_v3_users_group
        + snmpd_v3_users_host
      }}

- name: Validate the role variables
  ansible.builtin.import_tasks:
    file: assert.yml

- name: Ensure snmpd is installed
  ansible.builtin.package:
    name: "{{ snmpd_packages }}"
    state: present

- name: Configure SNMPv3 users
  when: snmpd_v3_users | length > 0
  block:
    - name: Ensure the SNMPv3 persistence file exists
      ansible.builtin.copy:
        dest: "{{ snmpd_v3_users_file }}"
        content: ""
        force: false
        owner: root
        group: root
        mode: "0600"

    - name: Read the SNMPv3 persistence file
      ansible.builtin.slurp:
        src: "{{ snmpd_v3_users_file }}"
      register: _snmpd_persistence

    - name: Split the SNMPv3 persistence file into lines
      ansible.builtin.set_fact:
        _snmpd_persistence_lines: >-
          {{ (_snmpd_persistence.content | b64decode).splitlines() | map('trim') | list }}
      changed_when: false

    - name: Determine which SNMPv3 users the persistence file already knows about
      ansible.builtin.set_fact:
        # Once snmpd has started it replaces the plaintext `createUser` lines it
        # was given with `usmUser` lines holding hashed keys, so both forms have
        # to be recognised to keep this role idempotent.
        _snmpd_existing_usernames: >-
          {{
            (
              _snmpd_persistence_lines
              | select('match', '^createUser\s+\S')
              | map('regex_replace', '^createUser\s+(\S+).*$', '\1')
              | list
              + _snmpd_persistence_lines
              | select('match', '^usmUser\s')
              | map('regex_replace', '^usmUser\s+\S+\s+\S+\s+\S+\s+\S+\s+"?([^"\s]+)"?.*$', '\1')
              | list
            )
          }}
      changed_when: false

    - name: Reset the list of SNMPv3 user definitions to create
      ansible.builtin.set_fact:
        snmpd_v3_users_pending: []
      changed_when: false

    - name: Determine which SNMPv3 user definitions are missing
      ansible.builtin.set_fact:
        snmpd_v3_users_pending: "{{ snmpd_v3_users_pending + [item] }}"
      loop: "{{ snmpd_v3_users }}"
      loop_control:
        label: "{{ item.username }}"
      when: item.username not in _snmpd_existing_usernames
      changed_when: false

    - name: Stop snmpd before writing new user definitions
      ansible.builtin.service:
        name: "{{ snmpd_service }}"
        state: stopped
      when: snmpd_v3_users_pending | length > 0

    - name: Persist the missing SNMPv3 user definitions
      ansible.builtin.lineinfile:
        path: "{{ snmpd_v3_users_file }}"
        line: "{{ _snmpd_definition }}"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ snmpd_v3_users_pending }}"
      loop_control:
        label: "{{ item.username }}"
      vars:
        _snmpd_definition: >-
          createUser
          {{ item.username }}
          {{ item.auth_proto }}
          "{{ item.auth_pass }}"
          {{ item.priv_proto }}
          "{{ item.priv_pass }}"
      notify:
        - Restart snmpd

- name: Configure snmpd
  ansible.builtin.template:
    src: snmpd.conf.j2
    dest: "{{ snmpd_config_file }}"
    owner: root
    group: root
    mode: "0600"
  notify:
    - Restart snmpd

- name: Apply the pending handler notifications
  ansible.builtin.meta: flush_handlers

- name: Ensure snmpd is running and enabled at boot
  ansible.builtin.service:
    name: "{{ snmpd_service }}"
    state: started
    enabled: true
