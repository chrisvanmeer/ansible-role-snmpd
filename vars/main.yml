---
# vars file for ansible-role-snmpd

# Internal mapping used to resolve `snmpd_packages` per OS family.
# It lives in vars/ on purpose: it is an implementation detail and should not be
# something a playbook overrides directly.
_snmpd_packages:
  default:
    - snmpd
  Alpine:
    - net-snmp
  RedHat:
    - net-snmp
  Suse:
    - net-snmp
