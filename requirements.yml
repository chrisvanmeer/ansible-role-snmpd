---
# Collections that are needed to *test* the role. The role itself only uses
# ansible.builtin, so nothing here is required at runtime.
#
# Both collections are used by the playbooks that ship with molecule's docker
# driver: create.yml and destroy.yml reach for community.docker to build and
# manage the container, and for ansible.posix.synchronize to copy the
# provisioner files into it. molecule-plugins does not pull either one in, so
# they have to be installed explicitly.
collections:
  - name: community.docker
    version: ">=3.10.0"
  - name: ansible.posix
    version: ">=1.5.4"
