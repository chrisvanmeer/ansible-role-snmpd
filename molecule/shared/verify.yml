---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  vars:
    _snmp_client_package: >-
      {{
        'net-snmp-utils'
        if ansible_facts.os_family == 'RedHat'
        else 'snmp'
      }}
    _snmp_v3_users_file: >-
      {{
        '/var/lib/snmp/snmpd.conf'
        if ansible_facts.os_family == 'Debian'
        else '/var/lib/net-snmp/snmpd.conf'
      }}
    # Expected directives, compared against the rendered file with all runs of
    # whitespace collapsed to a single space so the template's padding does not
    # make these assertions brittle.
    _expected_directives:
      - "syslocation Amsterdam"
      - "syscontact root@example.com"
      - "sysServices 72"
      - "agentaddress udp:127.0.0.1:161"
      - "dontLogTCPWrappersConnects no"
      - "view systemview included .1.3.6.1.2.1.1"
      - "com2sec testUser default public"
      - "group testGroup v2c testUser"
      - 'access testGroup "" any noauth exact systemview none none'
      - "proc sshd"
      - "proc snmpd 4 1"
      - "disk /"
      - "load 12 14 14"
      - "rouser snmp authpriv"
      - "rouser snmpv3host"
    # Once snmpd has started it replaces the plaintext `createUser` lines with
    # `usmUser` lines holding hashed keys, so the presence of a user is asserted
    # by username. The plaintext credentials are proven by the SNMPv3 authPriv
    # queries further down.
    _expected_usernames:
      - snmp
      - snmpv3host
  tasks:
    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Assert snmpd is running and enabled at boot
      ansible.builtin.assert:
        that:
          - ansible_facts.services['snmpd.service'].state == 'running'
          - ansible_facts.services['snmpd.service'].status == 'enabled'
        fail_msg: >-
          snmpd is not running and enabled as expected:
          {{ ansible_facts.services['snmpd.service'] | default('not found') }}

    - name: Read the rendered snmpd configuration
      ansible.builtin.slurp:
        src: /etc/snmp/snmpd.conf
      register: _snmpd_config

    - name: Store the rendered configuration as normalised lines
      ansible.builtin.set_fact:
        _snmpd_config_lines: >-
          {{
            (_snmpd_config.content | b64decode).splitlines()
            | map('regex_replace', '\s+', ' ')
            | map('trim')
            | list
          }}

    - name: Assert every expected directive is present
      ansible.builtin.assert:
        that:
          - item in _snmpd_config_lines
        fail_msg: >-
          "{{ item }}" is missing from /etc/snmp/snmpd.conf.
          Rendered directives: {{ _snmpd_config_lines }}
      loop: "{{ _expected_directives }}"

    - name: Read the SNMPv3 persistence file
      ansible.builtin.slurp:
        src: "{{ _snmp_v3_users_file }}"
      register: _snmpd_persistence

    - name: Store the persistence file as normalised lines
      ansible.builtin.set_fact:
        _snmpd_persistence_lines: >-
          {{ (_snmpd_persistence.content | b64decode).splitlines() | map('trim') | list }}

    - name: Collect the usernames the persistence file knows about
      ansible.builtin.set_fact:
        _snmpd_persisted_usernames: >-
          {{
            (
              _snmpd_persistence_lines
              | select('match', '^createUser\s+\S')
              | map('regex_replace', '^createUser\s+(\S+).*$', '\1')
              | list
              + _snmpd_persistence_lines
              | select('match', '^usmUser\s')
              | map('regex_replace', '^usmUser\s+\S+\s+\S+\s+\S+\s+\S+\s+"?([^"\s]+)"?.*$', '\1')
              | list
            )
          }}

    - name: Assert every SNMPv3 user was persisted exactly once
      ansible.builtin.assert:
        # Note: the list.count() method silently returns 0 under Jinja2, so the
        # select() filter is used to count occurrences instead.
        that:
          - _snmpd_persisted_usernames | select('eq', item) | list | length == 1
        fail_msg: >-
          "{{ item }}" does not appear exactly once in {{ _snmp_v3_users_file }}.
          Persisted usernames: {{ _snmpd_persisted_usernames }}
      loop: "{{ _expected_usernames }}"

    - name: Stat the configuration and persistence files
      ansible.builtin.stat:
        path: "{{ item }}"
      register: _snmpd_files
      loop:
        - /etc/snmp/snmpd.conf
        - "{{ _snmp_v3_users_file }}"

    - name: Assert the SNMP files are not world readable
      ansible.builtin.assert:
        that:
          - item.stat.mode == '0600'
        fail_msg: >-
          {{ item.item }} has mode {{ item.stat.mode }} but must be 0600 because
          it contains SNMP community strings and user credentials.
      loop: "{{ _snmpd_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Install the SNMP client tools
      ansible.builtin.package:
        name: "{{ _snmp_client_package }}"
        state: present

    - name: Wait until snmpd answers SNMPv2c queries
      ansible.builtin.command: snmpget -v2c -c public -Ovq 127.0.0.1 .1.3.6.1.2.1.1.5.0
      register: _snmpget_v2c
      changed_when: false
      until: _snmpget_v2c.rc == 0
      retries: 10
      delay: 3

    - name: Assert the SNMPv2c query returns the host name
      ansible.builtin.assert:
        that:
          - _snmpget_v2c.stdout | length > 0
        fail_msg: "SNMPv2c query returned: {{ _snmpget_v2c.stdout }}"

    - name: Wait until snmpd answers SNMPv3 queries for the global user
      ansible.builtin.command: >-
        snmpget
        -v3
        -u snmp
        -l authPriv
        -a SHA
        -A Sa9e5nV3TestAuth
        -x AES
        -X Sa9e5nV3TestPriv
        -Ovq
        127.0.0.1
        .1.3.6.1.2.1.1.5.0
      register: _snmpget_v3
      changed_when: false
      until: _snmpget_v3.rc == 0
      retries: 10
      delay: 3

    - name: Assert the SNMPv3 query for the global user succeeds
      ansible.builtin.assert:
        that:
          - _snmpget_v3.stdout | length > 0
        fail_msg: "SNMPv3 query returned: {{ _snmpget_v3.stdout }}"

    - name: Wait until snmpd answers SNMPv3 queries for the host user
      ansible.builtin.command: >-
        snmpget
        -v3
        -u snmpv3host
        -l authPriv
        -a SHA-256
        -A Sa9e5nV3HostAuth
        -x AES-256
        -X Sa9e5nV3HostPriv
        -Ovq
        127.0.0.1
        .1.3.6.1.2.1.1.5.0
      register: _snmpget_v3_host
      changed_when: false
      until: _snmpget_v3_host.rc == 0
      retries: 10
      delay: 3

    - name: Assert the SNMPv3 query for the host user succeeds
      ansible.builtin.assert:
        that:
          - _snmpget_v3_host.stdout | length > 0
        fail_msg: "SNMPv3 query returned: {{ _snmpget_v3_host.stdout }}"
